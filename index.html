<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Surface Visualizer - z = x² - y²</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f9f9fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 90vw;
      height: 80vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    .info-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 15px;
      background: #ffffff;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-item {
      text-align: center;
    }
    .info-label {
      font-size: 11px;
      color: #888;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .info-val {
      font-size: 16px;
      font-weight: bold;
      color: #222;
    }
    .control-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 15px;
      background: #ffffff;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .control-label {
      font-size: 14px;
      color: #444;
      font-weight: 500;
    }
    input[type="range"] {
      width: 120px;
      accent-color: #222;
    }
    .num-box {
      background: #f4f4f6;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
    /* トグルスイッチのスタイル */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #222;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>

  <!-- Three.js と OrbitControls を CDN から読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="container">
  <div id="canvas-container"></div>

  <!-- 情報表示バー -->
  <div class="info-bar">
    <div class="info-item">
      <div class="info-label">FUNCTION</div>
      <div class="info-val">z = x² - y²</div>
    </div>
    <div style="width: 1px; height: 24px; background: #eee;"></div>
    <div class="info-item">
      <div class="info-label">GRID</div>
      <div class="info-val" id="grid-display">30 × 30</div>
    </div>
  </div>

  <!-- コントロールパネル -->
  <div class="control-panel">
    <div class="control-group">
      <span class="control-label">Grid Resolution</span>
      <input type="range" id="resolution-slider" min="10" max="80" value="30">
      <span class="num-box" id="res-val-box">30</span>
    </div>

    <div class="control-group">
      <span class="control-label">Show Wireframe</span>
      <label class="switch">
        <input type="checkbox" id="wireframe-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<script>
  // --- 基本設定 ---
  const container = document.getElementById('canvas-container');
  let scene, camera, renderer, controls;
  let mesh, wireframeMesh;
  const domainSize = 4; // x, y の定義域幅 [-2, 2]

  function init() {
    // 1. シーン・カメラ・レンダラーの設定
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(4, 5, 6);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 2. カメラ操作 (OrbitControls)
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    // 3. ライト（照明）
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 4. 座標軸 & 原点ラベル & 底面グリッド
    addHelperElements();

    // 5. 曲面の初期生成 (30x30)
    buildSurface(30, false);

    // イベントリスナー設定
    window.addEventListener('resize', onWindowResize);
    setupUIListeners();

    // アニメーションループ開始
    animate();
  }

  // --- 軸と原点テキストの描画 ---
  function addHelperElements() {
    // 座標軸 (X:赤, Y:緑, Z:青)
    const axesHelper = new THREE.AxesHelper(2.5);
    scene.add(axesHelper);

    // 底面グリッド
    const gridHelper = new THREE.GridHelper(4, 10, 0xdddddd, 0xeeeeee);
    gridHelper.position.y = -2.2;
    scene.add(gridHelper);

    // 原点 (0,0,0) のスプライトテキスト
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.font = 'Bold 28px sans-serif';
    ctx.fillStyle = '#ff8c00';
    ctx.fillText('(0,0,0)', 10, 40);
    
    const texture = new THREE.CanvasTexture(canvas);
    const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
    const sprite = new THREE.Sprite(spriteMaterial);
    sprite.position.set(0.2, 0.3, 0);
    sprite.scale.set(1.2, 0.6, 1);
    scene.add(sprite);
  }

  // --- 曲面の生成関数 ---
  function buildSurface(segments, showWireframe) {
    if (mesh) scene.remove(mesh);
    if (wireframeMesh) scene.remove(wireframeMesh);

    // ジオメトリ（平面メッシュ）の作成
    const geometry = new THREE.PlaneGeometry(domainSize, domainSize, segments, segments);
    geometry.rotateX(-Math.PI / 2); // XZ平面に寝かせる

    const pos = geometry.attributes.position;
    const count = pos.count;
    const colors = [];

    // 各頂点の z 座標に z = x^2 - y^2 を計算し、高度に応じて色を設定
    for (let i = 0; i < count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i); // Three.js では前後が Z 軸（元の y に相当）
      
      const y = Math.pow(x, 2) - Math.pow(z, 2); // z = x^2 - y^2 の高さ計算
      pos.setY(i, y);

      // 色計算（レインボーグラデーション）
      // y の範囲 [-4, 4] を [0, 1] に正規化して HSL の Hue に変換
      const normalizedY = (y + 4) / 8;
      const hue = (1 - Math.max(0, Math.min(1, normalizedY))) * 0.7; // 青(0.7) 〜 赤(0)
      const color = new THREE.Color();
      color.setHSL(hue, 1.0, 0.5);

      colors.push(color.r, color.g, color.b);
    }

    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    // マテリアル（表面の質感）
    const material = new THREE.MeshPhongMaterial({
      vertexColors: true,
      side: THREE.DoubleSide,
      shininess: 40,
      wireframe: false
    });

    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // ワイヤーフレーム用のオーバーレイメッシュ
    if (showWireframe) {
      const wireMaterial = new THREE.MeshBasicMaterial({
        color: 0x333333,
        wireframe: true,
        transparent: true,
        opacity: 0.3
      });
      wireframeMesh = new THREE.Mesh(geometry, wireMaterial);
      scene.add(wireframeMesh);
    }
  }

  // --- UI イベント制御 ---
  function setupUIListeners() {
    const slider = document.getElementById('resolution-slider');
    const resBox = document.getElementById('res-val-box');
    const gridDisplay = document.getElementById('grid-display');
    const toggle = document.getElementById('wireframe-toggle');

    function update() {
      const val = parseInt(slider.value);
      resBox.textContent = val;
      gridDisplay.textContent = `${val} × ${val}`;
      buildSurface(val, toggle.checked);
    }

    slider.addEventListener('input', update);
    toggle.addEventListener('change', update);
  }

  function onWindowResize() {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  init();
</script>

</body>
</html>
